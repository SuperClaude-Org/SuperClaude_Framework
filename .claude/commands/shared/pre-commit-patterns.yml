# Pre-commit Patterns
# Simple pre-commit hook configuration and management

```yaml
Pre_Commit_Setup:
  Install_Python: "uv add --dev pre-commit && uv run pre-commit install"
  Install_Node: "npm install --save-dev pre-commit && npx pre-commit install"
  Config: ".pre-commit-config.yaml"

  Basic_Hooks:
    - "trailing-whitespace"
    - "end-of-file-fixer"
    - "check-yaml"
    - "check-json"
    - "check-merge-conflict"

  Language_Hooks:
    Python: ["black", "ruff", "isort"]
    JavaScript: ["eslint", "prettier"]
    TypeScript: ["eslint", "prettier"]
    Node: ["eslint", "prettier", "npm-audit"]

  Security_Hooks:
    - "detect-secrets"
    - "bandit"

  Commands:
    Run_All: "pre-commit run --all-files"
    Test_Hooks: "pre-commit run --hook-stage manual"
    Skip_Hooks: "git commit --no-verify"
    Update: "pre-commit autoupdate"

Commit_Msg_Hook:
  Script: "commands/shared/commit-msg-normalize.sh"
  Install: "cp commands/shared/commit-msg-normalize.sh .git/hooks/commit-msg && chmod +x .git/hooks/commit-msg"
  Purpose: "Validate and normalize commit messages to Conventional Commits format"
  Enforces:
    - "Valid type prefix: feat|fix|docs|style|refactor|test|chore"
    - "Lowercase type (auto-normalized)"
    - "Subject line under 72 characters"
    - "No trailing period on subject (auto-removed)"
    - "Body lines wrapped at 72 characters"
    - "Trailers and URLs preserved during wrapping"
```